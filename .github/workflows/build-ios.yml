name: Build TakenCafe iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Capacitor iOS
        run: |
          mkdir -p www
          cp index.html manifest.json icon.png ui.css ravi-fixes.js ravi-cloud.js sw.js www/
          cp -R icons www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          npx cap init "TakenCafe" "com.takencafe.app" --web-dir www
          npx cap add ios

      - name: Build Unsigned IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r TakenCafe-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v5
        with:
          name: TakenCafe-iOS-IPA
          path: ios/App/build/TakenCafe-iOS.ipa
          if-no-files-found: error
