name: Build TakenCafe Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Stage shared RAVI app
        run: |
          node -e "const fs=require('fs');for(const f of ['index.html','manifest.json','ui.css','ravi-fixes.js','ravi-cloud.js','sw.js','icon.png'])fs.copyFileSync('../'+f,f);fs.cpSync('../icons','icons',{recursive:true})"
          node --check main.cjs
          node --check ravi-fixes.js
          node --check ravi-cloud.js
      - run: npm install
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: RAVI-POS-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
