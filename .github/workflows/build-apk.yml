name: Build TakenCafe APK

on:
  push:
    branches: [ main, qa/js-syntax-validation, fix/ravi-branding-security-desktop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare web files and Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json icon.png ui.css ravi-fixes.js sw.js www/
          cp -R icons www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "RAVI POS" "com.takencafe.ravi.fresh" --web-dir www
          npx cap add android
          echo 'configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22" } }' >> android/app/build.gradle

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('www/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline script found in index.html')
          Path('/tmp/takencafe-inline.js').write_text(max(scripts, key=len), encoding='utf-8')
          PY
          node --check /tmp/takencafe-inline.js
          node --check www/ravi-fixes.js
          node --check www/sw.js
          python3 -m json.tool www/manifest.json > /dev/null

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug; then exit 0; fi
            sleep $((attempt * 30))
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: RAVI-POS-Fresh-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
